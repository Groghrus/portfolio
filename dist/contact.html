<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="css/all.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">

    <!--favicon-->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <title>Contact Me</title>
</head>
<body>

<header>
    <div class="menu-btn">
        <div class="btn-line"></div>
        <div class="btn-line"></div>
        <div class="btn-line"></div>
    </div>
    <nav class="menu">
        <div class="menu-logo">
            <div class="portrait"></div>
        </div>
        <ul class="menu-nav">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="about.html" class="nav-link">About Me</a></li>
            <li class="nav-item"><a href="work.html" class="nav-link">My Work</a></li>
            <li class="nav-item current"><a href="contact.html" class="nav-link">Contacts</a></li>
        </ul>
    </nav>
</header>
<main class="main" id="contact">
    <h1 class="lg-heading">
        Contact <span class="text-animation">Me</span>
    </h1>
    <h2 class="sm-heading mb-heading">
        This is how you can reach me.
    </h2>

    <div class="contact__form">
        <form id="form">
            <div class="container">
                <div class="contact__form-name">
                    <input class="input__name half-left line-bottom" placeholder="Name" type="text" name="name" data-rule="name">
                    <input class="input__email half-right line-bottom" placeholder="Email" type="text" name="email" data-rule="email">
                </div>
                <div class="contact__form-subject">
                    <input class="input__subject line-bottom" placeholder="Subject" type="text" name="subject" >
                </div>
                <div class="contact__form-message">
                    <textarea class="textarea__field line-bottom" placeholder="Message" name="message"></textarea>
                </div>
            </div>
            <div class="contact__form-submit">
                <button class="contact__form-button" type="submit">send</button>
            </div>

        </form>
    </div>

</main>
<footer id="footer">
    <h3>Copyright &copy; 2020</h3>
</footer>

<script src="js/main.js"></script>
<script src="js/form.js"></script>
</body>
</html>
